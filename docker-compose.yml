services:

  postgres:
    image: postgres:16
    container_name: societyhub-postgres
    environment:
      POSTGRES_DB: societyhub
      POSTGRES_USER: societyhub
      POSTGRES_PASSWORD: societyhub_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: